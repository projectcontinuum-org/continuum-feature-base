name: Release

on:
  release:
    types: [published]

jobs:
  release:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Libraries → Maven Central
          - module: features:continuum-feature-analytics
            publish_to_maven: true
            publish_to_docker_hub: false
          # Services → Docker Hub
          - module: worker
            publish_to_maven: false
            publish_to_docker_hub: true
    uses: ./.github/workflows/generic-module-builder.yml
    with:
      module-name: ${{ matrix.module }}
      publish_to_maven: ${{ matrix.publish_to_maven }}
      publish_to_docker_hub: ${{ matrix.publish_to_docker_hub }}
    secrets:
      MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
